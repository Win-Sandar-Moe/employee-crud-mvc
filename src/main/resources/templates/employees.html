<!DOCTYPE html>
<html th:replace="~{layout/masterLayout :: layout(~{::main})}" 
	xmlns:th="http://www.thymeleaf.org">

<body>
<main role="main">
	<div class="container mt-5">
		<div class="row">
			<div class="col">
				<a class="btn btn-success my-3" th:href="@{/add-employee}">Add Employee</a>
				<div class="card">
					<div class="card-header">
						<h5>Employee Table</h5>
					</div>
					<table class="table table-striped table-hover table-bordered rounded">
						<thead>
							<tr>
								<th>Id</th>
								<th>FirstName</th>
								<th>LastName</th>
								<th>Email</th>
								<th>PhoneNumber</th>
								<th>HiredDate</th>
								<th>Action</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="emp : ${employees}">
								<th th:text="${emp.id}"></th>
								<th th:text="${emp.firstName}"></th>
								<th th:text="${emp.lastName}"></th>
								<th th:text="${emp.email}"></th>
								<th th:text="${emp.phoneNumber}"></th>
								<th th:text="${emp.hiredDate}"></th>
								<th>
									<a
									th:href="@{'/edit-employee?id='+ ${emp.id}}"
									 class="btn btn-outline-primary me-2">Edit</a>
									<a 
									th:href="@{'/delete-employee?id='+ ${emp.id}}"
									 class="btn btn-outline-danger">Delete</a>
								</th>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</main>
</body>
</html>
